[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signal-ai"
version = "0.1.0"
description = "Multi-market analysis and trading signal research platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.5,<3.0", "pydantic>=2.9,<3.0"]

[project.optional-dependencies]
db = ["SQLAlchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "alembic>=1.13,<2.0"]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
